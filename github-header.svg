<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs>
    <linearGradient id="bg" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#5146B8">
        <animate attributeName="stop-color"
                 values="#5146B8;#6758D3;#5146B8"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="52%" stop-color="#7868E6">
        <animate attributeName="stop-color"
                 values="#7868E6;#8B7CF2;#7868E6"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8B8CFF">
        <animate attributeName="stop-color"
                 values="#8B8CFF;#6F78E8;#8B8CFF"
                 dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#BFF7FF" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#BFF7FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="268" rx="28" fill="url(#bg)" stroke="#A9A7FF" stroke-opacity=".35"/>

  <!-- very subtle moving glow -->
  <circle cx="170" cy="60" r="145" fill="url(#glow)" filter="url(#softGlow)" opacity=".55">
    <animate attributeName="cx" values="170;320;170" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="215" r="170" fill="url(#glow)" filter="url(#softGlow)" opacity=".32">
    <animate attributeName="cx" values="1040;900;1040" dur="13s" repeatCount="indefinite"/>
  </circle>

  <!-- tiny ambient dots -->
  <g fill="#D8FBFF">
    <circle cx="195" cy="187" r="3" opacity=".25">
      <animate attributeName="opacity" values=".15;.55;.15" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="78" r="2.5" opacity=".35">
      <animate attributeName="opacity" values=".2;.65;.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="142" r="2" opacity=".25">
      <animate attributeName="opacity" values=".1;.5;.1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="126" text-anchor="middle"
        fill="#FFFFFF"
        font-family="'Courier New', monospace"
        font-size="55" font-weight="700"
        letter-spacing="1.5">SeungYeon Shin</text>

  <text x="600" y="178" text-anchor="middle"
        fill="#C8F8FF"
        font-family="'Courier New', monospace"
        font-size="23" font-weight="600"
        letter-spacing="2.2">AI · LLM · Software Engineering</text>
</svg>
